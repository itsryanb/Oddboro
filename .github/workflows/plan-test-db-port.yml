# Fork only: proves NEW-1907 (fix/test-db-port-race). Twelve copies, five rounds, of a ledger test file
# that starts a test database run at once, on main's helper and on the fix's,
# and every EADDRINUSE is counted; then the ledger and office suites run as
# upstream's Checks runs them, on all three systems.
name: Plan test database port

on:
  push:
    branches: [plan/test-db-port-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # As upstream's Checks runs them: the office's only off Windows, whose
      # stand-in tools start through their first line.
      - name: Ledger and office tests
        run: |
          status=0
          suites="@oddboro/ledger"
          [ "$RUNNER_OS" != Windows ] && suites="$suites @oddboro/office"
          for ws in $suites; do
            npx turbo run test --filter="$ws" > "$RUNNER_TEMP/out.txt" 2>&1 || status=1
            echo "::notice title=$ws::$(grep -E 'ℹ (tests|pass|fail|cancelled|skipped) ' "$RUNNER_TEMP/out.txt" | sed 's/.*ℹ/ℹ/' | tr '\n' ' ') EADDRINUSE: $(grep -c EADDRINUSE "$RUNNER_TEMP/out.txt" || true)"
            grep -E '✖ ' "$RUNNER_TEMP/out.txt" | grep -v 'failing tests' | sort -u | head -10 > "$RUNNER_TEMP/failed.txt" || true
            while read -r line; do echo "::error title=$ws::$line"; done < "$RUNNER_TEMP/failed.txt"
          done
          exit $status
