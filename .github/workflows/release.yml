# Every merge to main that changes the app builds the next release of
# Oddboro: for the Mac (signed, notarized and stapled), for Linux on x86_64
# and arm64 (AppImages) and for Windows on x64 and arm64 (installers), in one
# DRAFT release on the merge commit. The next
# version is the newest PUBLISHED release plus one patch, and each build
# replaces the draft before it, so a version is spent only when the owner
# publishes. A draft is invisible to releases/latest, so installed apps update
# only after that. A merge that touches only the site or the docs builds
# nothing; run this by hand for a change it misses, like a lockfile-only
# update. The secrets it needs, and how to make each, are in
# apps/desktop/CLAUDE.md.
name: Release

on:
  push:
    branches: [main]
    # What goes into the app: the shell, the office it carries, the packages
    # the office uses, the Node it bundles, and this workflow.
    paths:
      - apps/desktop/**
      - apps/office/**
      - packages/**
      - .nvmrc
      - .github/workflows/release.yml
      - '!**/CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: write

# One at a time, so two builds never race for the same draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      # Published releases only: a draft keeps its number until it is
      # published or the next build replaces it.
      - name: Pick the version
        id: version
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft | not) | .tag_name' \
            | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [ -z "$last" ]; then
            next=0.0.1
          else
            IFS=. read -r major minor patch <<< "$last"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Building $next (the highest published release: ${last:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo 'notes<<ODDBORO_NOTES_END'
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" --jq .body
            echo 'ODDBORO_NOTES_END'
          } >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-15
    # The signing keys live in the release environment, which only main may
    # use, so a run from any other branch never sees them.
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/oddboro.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          # shellcheck disable=SC2046 # each keychain path is its own argument
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity in APPLE_CERTIFICATE" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ODDBORO_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENTS" > "$APPLE_API_KEY_PATH"
          unset APPLE_API_KEY_CONTENTS
          ODDBORO_RELEASE_NOTES="$NOTES" \
          ODDBORO_RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" \
            node apps/desktop/scripts/release.ts --version "$VERSION"
          rm -f "$APPLE_API_KEY_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: apps/desktop/release/
          if-no-files-found: error

      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/oddboro.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          # 22.04, the oldest supported Ubuntu, so the AppImages run on
          # systems with an older glibc too.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # GStreamer's plugins go into the AppImage as they are installed here:
      # libav decodes the office's AAC music, and PulseAudio and PipeWire
      # play it.
      - name: Install the libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf file build-essential \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            gstreamer1.0-pulseaudio gstreamer1.0-pipewire

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.arch }}-

      - run: npm ci --no-audit --no-fund

      - name: Build the AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ODDBORO_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          ODDBORO_RELEASE_NOTES="$NOTES" \
          ODDBORO_RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" \
            node apps/desktop/scripts/release.ts --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: apps/desktop/release/
          if-no-files-found: error

  windows:
    needs: version
    strategy:
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The x64 runner comes with rustup; the arm64 one may not.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf -o "$RUNNER_TEMP/rustup-init.exe" \
              "https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain none
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.arch }}-

      - run: npm ci --no-audit --no-fund

      # On arm64 Windows the registry sends Rust's build to a Windows Kits
      # folder with no rc.exe, which puts the icon in the app, and ring's C
      # code needs clang. Name both where the runner has them.
      - name: Point the build at the SDK's tools
        if: matrix.arch == 'arm64'
        run: |
          rc=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -ipath '*/arm64/rc.exe' 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$rc" ]; then
            echo "RC=$(cygpath -w "$rc")" >> "$GITHUB_ENV"
          fi
          if ! command -v clang >/dev/null; then
            vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
              -latest -products '*' -property installationPath | tr -d '\r')
            llvm="$(cygpath -u "$vs")/VC/Tools/Llvm/ARM64/bin"
            if [ -d "$llvm" ]; then
              cygpath -w "$llvm" >> "$GITHUB_PATH"
            fi
          fi

      - name: Build the installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ODDBORO_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          ODDBORO_RELEASE_NOTES="$NOTES" \
          ODDBORO_RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" \
            node apps/desktop/scripts/release.ts --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: apps/desktop/release/
          if-no-files-found: error

  # Each build installed and run as an owner would, on its own kind of
  # machine, before any draft exists (apps/desktop/CLAUDE.md, "Smoke tests").
  # No secrets: it only reads what the builds made. Ubuntu 24.04 runs the
  # x86_64 AppImage too, as a newer system than the one that built it.
  smoke:
    needs: [version, mac, linux, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: mac
            runner: macos-15
          - build: linux-x86_64
            runner: ubuntu-22.04
          - build: linux-x86_64
            runner: ubuntu-24.04
          - build: linux-aarch64
            runner: ubuntu-22.04-arm
          - build: windows-x64
            runner: windows-latest
          - build: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.build }}
          path: ${{ runner.temp }}/built

      # A display, a session bus with an unlocked keyring, FUSE for the
      # AppImage (libfuse2t64 on 24.04), and WebDriver to drive its window.
      - name: Install what Linux needs to run the app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          fuse=libfuse2; if [ "$(lsb_release -rs)" = "24.04" ]; then fuse=libfuse2t64; fi
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 gnome-keyring \
            libsecret-tools "$fuse" webkit2gtk-driver imagemagick xdotool
          rustup toolchain install stable --profile minimal
          cargo install tauri-driver --locked

      - name: Smoke test the build
        if: runner.os != 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          node apps/desktop/scripts/smoke.ts --from "$RUNNER_TEMP/built" --version "$VERSION"
          --signed --out "$RUNNER_TEMP/smoke"

      - name: Smoke test the build
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dbus-run-session -- bash -c '
            echo -n smoke | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            xvfb-run -a -s "-screen 0 1440x900x24" node apps/desktop/scripts/smoke.ts \
              --from "$RUNNER_TEMP/built" --version "$VERSION" --out "$RUNNER_TEMP/smoke"'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.build }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn

  draft:
    needs: [version, mac, linux, windows, smoke]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built

      - name: Draft the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          # One latest.json for every machine: each build wrote its own.
          jq -s '.[0] + { platforms: (map(.platforms) | add) }' \
            built/mac/latest.json built/linux-x86_64/latest.json built/linux-aarch64/latest.json \
            built/windows-x64/latest.json built/windows-arm64/latest.json \
            > latest.json
          printf '%s\n' "$NOTES" > notes.md
          # The draft this one replaces. A draft has no tag yet, so only the
          # release goes; the old builds stay until the new ones are ready.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id" \
            | while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Oddboro $VERSION" --notes-file notes.md \
            built/mac/Oddboro.dmg \
            "built/mac/Oddboro_${VERSION}_aarch64.dmg" \
            "built/mac/Oddboro_${VERSION}_aarch64.app.tar.gz" \
            "built/mac/Oddboro_${VERSION}_aarch64.app.tar.gz.sig" \
            built/linux-x86_64/Oddboro-x86_64.AppImage \
            "built/linux-x86_64/Oddboro_${VERSION}_x86_64.AppImage" \
            "built/linux-x86_64/Oddboro_${VERSION}_x86_64.AppImage.sig" \
            built/linux-aarch64/Oddboro-aarch64.AppImage \
            "built/linux-aarch64/Oddboro_${VERSION}_aarch64.AppImage" \
            "built/linux-aarch64/Oddboro_${VERSION}_aarch64.AppImage.sig" \
            built/windows-x64/Oddboro-x64-setup.exe \
            "built/windows-x64/Oddboro_${VERSION}_x64-setup.exe" \
            "built/windows-x64/Oddboro_${VERSION}_x64-setup.exe.sig" \
            built/windows-arm64/Oddboro-arm64-setup.exe \
            "built/windows-arm64/Oddboro_${VERSION}_arm64-setup.exe" \
            "built/windows-arm64/Oddboro_${VERSION}_arm64-setup.exe.sig" \
            latest.json
