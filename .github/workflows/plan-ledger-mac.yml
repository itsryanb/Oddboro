# Fork only (NEW-1874): where the ledger suite's time goes on each runner,
# five times on macos-15, with no 10-minute cut-off, read out as annotations.
name: Plan ledger mac

on:
  push:
    branches: [plan/ledger-mac-measure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: ledger (${{ matrix.runner }}, ${{ matrix.files }} at once, ${{ matrix.try }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, files: 2, try: 1 }
          - { runner: macos-15, files: 2, try: 2 }
          - { runner: macos-15, files: 3, try: 1 }
          - { runner: macos-15, files: 3, try: 2 }
          - { runner: macos-15, files: 4, try: 1 }
          - { runner: macos-15, files: 4, try: 2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Ledger tests
        id: tests
        timeout-minutes: 25
        continue-on-error: true
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../../scripts/test-times.ts --test-reporter-destination=${{ runner.temp }}/test-times/ledger.jsonl
        # The ledger's own test script, with --test-concurrency, which
        # NODE_OPTIONS does not take.
        working-directory: packages/ledger
        run: |
          mkdir -p "$RUNNER_TEMP/test-times"
          echo "::notice title=Machine::$(node -e 'const o=require("os"); console.log(o.availableParallelism()+" cores, "+Math.round(o.totalmem()/2**30)+" GB, "+o.cpus()[0].model)')"
          start=$(date +%s)
          node --test --test-concurrency=${{ matrix.files }} --test-timeout=15000 --experimental-test-module-mocks "test/*.test.ts" 2>&1 | tee "$RUNNER_TEMP/out.txt"
          status=${PIPESTATUS[0]}
          echo "::notice title=Ledger step::exit $status after $(( $(date +%s) - start )) s"
          exit $status

      - name: Where the time went
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(process.env.RUNNER_TEMP + "/test-times/ledger.jsonl", "utf8").split("\n").filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return {}; } });
            const ends = new Map(lines.filter((l) => l.end).map((l) => [l.end, l.seconds]));
            const started = lines.filter((l) => l.start).map((l) => l.start);
            const sums = new Map();
            for (const l of lines.filter((l) => l.test)) sums.set(l.file, (sums.get(l.file) || 0) + l.seconds);
            const files = [...ends].sort((a, b) => b[1] - a[1]).slice(0, 12)
              .map(([f, s]) => `${f.replace("packages/ledger/test/", "")} ${s.toFixed(1)}s (tests ${(sums.get(f) || 0).toFixed(1)}s)`);
            console.log(`::notice title=Slowest files (file time, its tests)::${files.join(" | ")}`);
            const tests = lines.filter((l) => l.test).sort((a, b) => b.seconds - a.seconds).slice(0, 12)
              .map((l) => `${l.file.replace("packages/ledger/test/", "")}: ${l.test.slice(0, 70)} ${l.seconds.toFixed(1)}s`);
            console.log(`::notice title=Slowest tests::${tests.join(" | ")}`);
            const hung = started.filter((f) => !ends.has(f));
            const done = lines.find((l) => l.done);
            console.log(`::notice title=Run::${done ? done.done.toFixed(0) + " s" : "did not finish"}, ${started.length} files, unfinished: ${hung.join(", ") || "none"}`);
          '
          echo "::notice title=Teardowns, slowest close first::$(grep -o 'TEARDOWN.*' "$RUNNER_TEMP/out.txt" | sed 's/TEARDOWN //' | sort -t= -k3 -n -r | head -12 | tr '\n' '|')"
          grep -E "^\s*✖ |timed out|cancelled" "$RUNNER_TEMP/out.txt" | sort -u | head -15 | while read -r l; do echo "::warning title=Failed::$l"; done
